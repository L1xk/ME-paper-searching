[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "me-protein-paper-radar"
version = "0.1.0"
description = "Unattended weekly literature radar for microbial metabolic engineering and AI-assisted enzyme engineering."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
me-protein-radar = "me_protein_radar.pipeline:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

