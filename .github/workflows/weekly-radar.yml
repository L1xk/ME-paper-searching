name: ME Protein Weekly Radar

on:
  schedule:
    # Daily retry check: 10:46 Beijing = 02:46 UTC. The ISO-week lock permits one delivery per week.
    - cron: "46 2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "test adds a subject prefix and never updates recommendation history"
        required: true
        default: "test"
        type: choice
        options: [test, production]

concurrency:
  group: me-protein-weekly-radar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      QQ_EMAIL: ${{ secrets.QQ_EMAIL }}
      QQ_EMAIL_AUTH_CODE: ${{ secrets.QQ_EMAIL_AUTH_CODE }}
      RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      RUN_MODE: ${{ github.event_name == 'schedule' && 'production' || inputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install and run offline tests
        run: |
          python -m pip install -e .
          python -m unittest discover -s tests -v

      - name: Retrieve, verify, select, summarize, and send
        id: radar
        continue-on-error: true
        run: python -m me_protein_radar --mode "$RUN_MODE"

      - name: Record a failure heartbeat when the pipeline did not complete
        if: failure() && steps.radar.outcome != 'failure'
        run: python scripts/workflow_status.py

      - name: Preserve budget, delivery lock, health status, and successful history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/usage.json data/history.json data/delivery_state.json data/automation_status.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update radar state [skip ci]"
            for attempt in 1 2 3; do
              if git push; then
                exit 0
              fi
              echo "State push attempt ${attempt} failed; rebasing on origin/main"
              git fetch origin main
              git rebase origin/main
            done
            echo "Unable to preserve radar state after 3 attempts" >&2
            exit 1
          fi

      - name: Upload generated report for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: me-protein-radar-output
          path: output/
          if-no-files-found: ignore
          retention-days: 14

      - name: Alert for failures outside the main radar step
        if: failure() && steps.radar.outcome != 'failure'
        run: |
          python scripts/workflow_alert.py "Repository: $GITHUB_REPOSITORY" "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Propagate radar failure
        if: steps.radar.outcome == 'failure'
        run: exit 1
